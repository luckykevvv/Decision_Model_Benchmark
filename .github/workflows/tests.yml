name: benchmark checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: windows-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - run: python tools/check_public_scope.py
      - run: decision-benchmark verify
      - run: python -m unittest discover -s systematic -p "test_*.py"
      - run: python -m unittest discover -s tests -p "test_*.py"
      - run: decision-benchmark reproduce --profile quick --output-dir runs/ci --bootstrap-replicates 20
