[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "decision-model-benchmark"
version = "0.2.0"
description = "Candidate coverage, rejection policy transfer and missing-answer evaluation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Jiawen Lu"}, {name = "Tongtong Wu"}]
dependencies = ["numpy>=2.0,<3", "requests>=2.31,<3"]

[project.optional-dependencies]
data = ["pyarrow>=15"]
plots = ["matplotlib>=3.8,<4"]
laya = ["laya==0.3.21", "torch==2.8.0", "transformers==4.56.2", "huggingface-hub>=0.34,<1"]
qwen = ["torch==2.8.0", "transformers==4.56.2", "huggingface-hub>=0.34,<1"]

[project.scripts]
decision-benchmark = "decision_benchmark.cli:main"

[project.urls]
Repository = "https://github.com/luckykevvv/Decision_Model_Benchmark"

[tool.setuptools.packages.find]
include = ["decision_benchmark*", "systematic*", "tools*"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
decision_benchmark = ["resources/**/*.json", "resources/**/*.gz", "resources/*.json"]
